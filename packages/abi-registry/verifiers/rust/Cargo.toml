[package]
name = "orbital-attestation-verify"
version = "0.1.0"
edition = "2021"
description = "Reference verifier for Orbital attestation envelopes (version 1)"
license = "MIT"
publish = false

# Stand-alone: this crate is not part of any parent Cargo workspace.
[workspace]

[dependencies]
base64 = "0.22"
data-encoding = "2"
ed25519-dalek = { version = "2", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }
