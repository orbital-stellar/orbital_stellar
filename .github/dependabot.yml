version: 2

# Single pnpm entry at the workspace root.
# The root pnpm-lock.yaml covers every package.json in the workspace,
# so per-directory entries don't apply (they would update sub-package
# manifests without touching the root lockfile, leaving every PR
# unmergeable on `pnpm install --frozen-lockfile`).
updates:
  - package-ecosystem: pnpm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # TypeScript majors are held back deliberately. typescript-eslint fails
    # hard on TS 7 ("typescript-eslint does not support TS 7.0"), which reds
    # the lint job for every grouped dev-dependency PR that carries the bump
    # along - the rest of the group is then unmergeable for a reason that has
    # nothing to do with it. Lift this once typescript-eslint ships TS 7
    # support (and check Next's TS detection at the same time).
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
